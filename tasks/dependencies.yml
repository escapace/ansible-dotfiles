---
- name: enable gh repository
  ansible.builtin.command:
    cmd: dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
  tags:
    - molecule-idempotence-notest

- name: ensure a list of packages installed
  ansible.builtin.dnf:
    name: "{{ packages }}"
    state: present
    allowerasing: true
  vars:
    packages:
      - bash
      - bc
      - ca-certificates
      - curl
      - file
      - fish
      - fuse
      - gh
      - git
      - kitty-terminfo
      - mosh
      - neovim
      - ripgrep
      - rsync
      - sudo
      - tmux
      - unzip

- name: install vim requirements
  ansible.builtin.dnf:
    name: "{{ packages }}"
    state: present
    allowerasing: true
  vars:
    packages:
      - gcc
      - gcc-c++

- name: install python requirements
  ansible.builtin.dnf:
    name: "{{ packages }}"
    state: present
    allowerasing: true
  vars:
    packages:
      - gcc
      - zlib-devel
      - bzip2
      - bzip2-devel
      - readline-devel
      - sqlite
      - sqlite-devel
      - openssl-devel
      - tk-devel
      - libffi-devel
      - xz-devel
  when: dotfiles_uv_install | bool
