---
- name: enable gh repository
  ansible.builtin.yum_repository:
    name: gh-cli
    description: packages for the GitHub CLI
    baseurl: https://cli.github.com/packages/rpm
    enabled: true
    gpgcheck: true
    gpgkey: https://cli.github.com/packages/githubcli-archive-keyring.asc

- name: ensure a list of packages installed
  ansible.builtin.dnf:
    name: "{{ packages }}"
    state: present
    allowerasing: true
  vars:
    packages:
      - bash
      - bc
      - ca-certificates
      - curl
      - file
      - fish
      - fuse
      - gh
      - git
      - ghostty-terminfo
      - kitty-terminfo
      - mosh
      - neovim
      - ripgrep
      - rsync
      - selinux-policy-devel
      - sudo
      - tmux
      - unzip

- name: install vim requirements
  ansible.builtin.dnf:
    name: "{{ packages }}"
    state: present
    allowerasing: true
  vars:
    packages:
      - gcc
      - gcc-c++

- name: install python requirements
  ansible.builtin.dnf:
    name: "{{ packages }}"
    state: present
    allowerasing: true
  vars:
    packages:
      - gcc
      - zlib-devel
      - bzip2
      - bzip2-devel
      - readline-devel
      - sqlite
      - sqlite-devel
      - openssl-devel
      - tk-devel
      - libffi-devel
      - xz-devel
      - libxcrypt-compat
  when: dotfiles_uv_install | bool
