---
- ansible.builtin.include_tasks: dependencies.yaml

- name: ensure {{ dotfiles_username }} group is present
  ansible.builtin.group:
    name: "{{ dotfiles_username }}"
    state: present

- name: ensure {{ dotfiles_username }} user is present
  ansible.builtin.user:
    name: "{{ dotfiles_username }}"
    shell: /bin/fish
    group: "{{ dotfiles_username }}"

- name: set authorized key
  ansible.posix.authorized_key:
    user: "{{ dotfiles_username }}"
    state: present
    key: "{{ dotfiles_key }}"
  when: not((dotfiles_key is undefined) or (dotfiles_key is none) or (dotfiles_key | trim | length == 0))

- name: check groups
  ansible.builtin.shell: |
    set -o pipefail
    /usr/bin/getent group | awk -F":" '{print $1}'
  args:
    executable: /bin/bash
  register: dotfiles_etc_groups
  changed_when: false

- name: add secondary groups
  ansible.builtin.user:
    name: "{{ dotfiles_username }}"
    groups: "{{ item }}"
    append: true
  with_items:
    - admin
    - docker
    - libvirt
    - mail
    - sudo
    - vboxusers
    - wheel

  when: item in dotfiles_etc_groups.stdout_lines
- name: ensure keyboard interactive group is present
  ansible.builtin.group:
    name: "{{ dotfiles_keyboard_interactive_group }}"
    system: true
    state: present
  when: not((dotfiles_keyboard_interactive_group is undefined) or (dotfiles_keyboard_interactive_group is none) or (dotfiles_keyboard_interactive_group | trim | length == 0))

- name: add to keyboard interactive group
  ansible.builtin.user:
    name: "{{ dotfiles_username }}"
    groups: "{{ dotfiles_keyboard_interactive_group }}"
    append: true
  when: not((dotfiles_keyboard_interactive_group is undefined) or (dotfiles_keyboard_interactive_group is none) or (dotfiles_keyboard_interactive_group | trim | length == 0))

- name: allow {{ dotfiles_username }} to have passwordless sudo
  ansible.builtin.lineinfile:
    dest: /etc/sudoers.d/{{ dotfiles_username }}
    mode: "0640"
    create: true
    state: present
    regexp: ^{{ dotfiles_username }}
    line: "{{ dotfiles_username }} ALL=(ALL) NOPASSWD: ALL"
    validate: visudo -cf %s

- name: create directories
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ dotfiles_username }}"
    group: "{{ dotfiles_username }}"
    state: directory
    mode: "0750"
  with_items:
    - /home/{{ dotfiles_username }}/.local
    - /home/{{ dotfiles_username }}/.local/bin

- name: clone repository
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    dest: "{{ dotfiles_directory }}"
    recursive: true
    version: "{{ dotfiles_version }}"
    umask: "0027"
    update: false
    depth: "{{ omit if dotfiles_git_depth == 0 else dotfiles_git_depth }}"
  become: true
  become_user: "{{ dotfiles_username }}"

- name: install vim
  ansible.builtin.package:
    name: vim
  when: ansible_facts["architecture"] == "aarch64"

- name: check if uv exists
  ansible.builtin.stat:
    path: /home/{{ dotfiles_username }}/.local/bin/uv
  register: dotfiles_stat_uv
  when: dotfiles_uv_install | bool

- name: check if ~/.rustup exists
  ansible.builtin.stat:
    path: /home/{{ dotfiles_username }}/.rustup
  register: dotfiles_stat_rustup
  when: dotfiles_rustup_install | bool

- name: check if ~/.goenv/bin/goenv exists
  ansible.builtin.stat:
    path: "{{ dotfiles_goenv_directory }}/bin/goenv"
  register: dotfiles_stat_goenv
  when: dotfiles_goenv_install | bool

- name: check if pnpm exists
  ansible.builtin.stat:
    path: /home/{{ dotfiles_username }}/.local/share/pnpm/bin/pnpm
    follow: true
  register: dotfiles_stat_pnpm
  when: dotfiles_pnpm_install | bool

- name: create temporary directory
  ansible.builtin.file:
    path: "{{ dotfiles_tmp_directory }}"
    owner: "{{ dotfiles_username }}"
    group: "{{ dotfiles_username }}"
    state: directory
    mode: "0700"
  when: >-
    (dotfiles_uv_install | bool and not dotfiles_stat_uv.stat.exists | bool) or
    (dotfiles_rustup_install | bool and not dotfiles_stat_rustup.stat.exists | bool) or
    (dotfiles_goenv_install | bool and not dotfiles_stat_goenv.stat.exists | bool) or
    (dotfiles_pnpm_install | bool and not dotfiles_stat_pnpm.stat.exists | bool)

- name: download uv installer
  ansible.builtin.get_url:
    owner: "{{ dotfiles_username }}"
    group: "{{ dotfiles_username }}"
    validate_certs: true
    url: "{{ dotfiles_uv_installer }}"
    dest: "{{ dotfiles_tmp_directory }}/uv-installer"
    mode: "0700"
  when: dotfiles_uv_install | bool and not dotfiles_stat_uv.stat.exists | bool

- name: install uv
  ansible.builtin.shell: bash "{{ dotfiles_tmp_directory }}/uv-installer" --no-modify-path --quiet
  args:
    chdir: "{{ dotfiles_directory }}"
    creates: /home/{{ dotfiles_username }}/.local/bin/uv
  become: true
  become_user: "{{ dotfiles_username }}"
  when: dotfiles_uv_install | bool and not dotfiles_stat_uv.stat.exists | bool

- name: download rustup installer
  ansible.builtin.get_url:
    owner: "{{ dotfiles_username }}"
    group: "{{ dotfiles_username }}"
    validate_certs: true
    url: "{{ dotfiles_rustup_installer }}"
    dest: "{{ dotfiles_tmp_directory }}/rustup-installer"
    mode: "0700"
  when: dotfiles_rustup_install | bool and not dotfiles_stat_rustup.stat.exists | bool

- name: install rustup
  ansible.builtin.shell: sh "{{ dotfiles_tmp_directory }}/rustup-installer" "-y" "--no-modify-path"
  args:
    chdir: "{{ dotfiles_directory }}"
    creates: /home/{{ dotfiles_username }}/.rustup
  become: true
  become_user: "{{ dotfiles_username }}"
  environment:
    TMPDIR: "{{ dotfiles_tmp_directory }}"
  when: dotfiles_rustup_install | bool and not dotfiles_stat_rustup.stat.exists | bool

- name: download goenv installer
  ansible.builtin.get_url:
    owner: "{{ dotfiles_username }}"
    group: "{{ dotfiles_username }}"
    validate_certs: true
    url: "{{ dotfiles_goenv_installer }}"
    dest: "{{ dotfiles_tmp_directory }}/goenv-installer"
    mode: "0700"
  when: dotfiles_goenv_install | bool and not dotfiles_stat_goenv.stat.exists | bool

- name: install goenv
  ansible.builtin.shell: bash "{{ dotfiles_tmp_directory }}/goenv-installer"
  args:
    chdir: "{{ dotfiles_directory }}"
    creates: "{{ dotfiles_goenv_directory }}/bin/goenv"
  become: true
  become_user: "{{ dotfiles_username }}"
  when: dotfiles_goenv_install | bool and not dotfiles_stat_goenv.stat.exists | bool

- name: install nodenv and node-build
  ansible.builtin.include_tasks: nodenv.yaml
  when: dotfiles_nodenv_install | bool

- name: install dotfiles
  ansible.builtin.shell: ./manage install {{ dotfiles_online_install | bool | ternary('', '--offline') }}
  args:
    chdir: "{{ dotfiles_directory }}"
  become: true
  become_user: "{{ dotfiles_username }}"
  tags:
    - molecule-idempotence-notest

- name: download pnpm installer
  ansible.builtin.get_url:
    url: "{{ dotfiles_pnpm_installer }}"
    dest: "{{ dotfiles_tmp_directory }}/pnpm-installer"
    owner: "{{ dotfiles_username }}"
    group: "{{ dotfiles_username }}"
    mode: "0700"
    use_netrc: false
    timeout: 30
  when: dotfiles_pnpm_install | bool and not dotfiles_stat_pnpm.stat.exists | bool

- name: install pnpm without changing shell configuration
  ansible.builtin.command:
    argv:
      - /bin/sh
      - "{{ dotfiles_tmp_directory }}/pnpm-installer"
    chdir: /home/{{ dotfiles_username }}
    creates: /home/{{ dotfiles_username }}/.local/share/pnpm/bin/pnpm
  become: true
  become_user: "{{ dotfiles_username }}"
  environment:
    HOME: "/home/{{ dotfiles_username }}"
    PNPM_HOME: "/home/{{ dotfiles_username }}/.local/share/pnpm"
    PATH: "/home/{{ dotfiles_username }}/.local/share/pnpm/bin:{{ ansible_facts['env']['PATH'] }}"
    SHELL: ""
    ENV: ""
  when: dotfiles_pnpm_install | bool and not dotfiles_stat_pnpm.stat.exists | bool

- name: inspect installed pnpm executable
  ansible.builtin.stat:
    path: /home/{{ dotfiles_username }}/.local/share/pnpm/bin/pnpm
    follow: true
  register: dotfiles_installed_pnpm
  when:
    - dotfiles_pnpm_install | bool
    - not ansible_check_mode

- name: require a usable pnpm executable
  ansible.builtin.assert:
    that:
      - dotfiles_installed_pnpm.stat.isreg | default(false)
      - dotfiles_installed_pnpm.stat.executable | default(false)
    fail_msg: pnpm is not executable under /home/{{ dotfiles_username }}/.local/share/pnpm/bin.
  when:
    - dotfiles_pnpm_install | bool
    - not ansible_check_mode

- name: remove temporary directory
  ansible.builtin.file:
    path: "{{ dotfiles_tmp_directory }}"
    state: absent

- name: install optional cluster clients
  ansible.builtin.include_tasks: cli-tools.yaml

- name: prepare and install vim dotfiles
  ansible.builtin.include_tasks: vim.yaml
